name: Publish independent mobile web apps
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mobile-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate app logic
        run: |
          node samples/mobile-web/writing/tests.mjs
          node samples/mobile-web/preferences/tests.mjs
          node samples/mobile-web/documents/tests.mjs
      - name: Build exact public runtime files
        run: python3 samples/mobile-web/scripts/build-site.py --output "$RUNNER_TEMP/mobile-site"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/mobile-site
          retention-days: 1
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: Publish reviewed app shells
        id: publish
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
